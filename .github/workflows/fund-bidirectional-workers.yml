name: Fund Bidirectional Workers

# Funding is treasury automation, not request handling, so it lives here rather
# than inside the service. The pinger reports balances and refuses to lease an
# address that is short; nothing in the request path holds spending authority.
#
# Hourly, though GitHub runs only a fraction of these ticks. Each address holds
# SIG_BIDIRECTIONAL_FUND_TOPUP_ETH - SIG_BIDIRECTIONAL_MIN_BALANCE_WEI of
# headroom, and the defaults are sized in src/utils/env.ts so the pool
# outlasts a day of the scheduled one-a-minute load. A skipped tick then
# costs nothing, and the hourly cadence only shortens how long a drained pool
# waits for its refill.
#
# The ad hoc load test tops up the addresses it is about to use before it uses
# them, so a run does not depend on this timer to start. What it does depend on
# is a sweep landing mid-run — a run may last hours, longer than the headroom it
# starts with — and on the deployed service, which shares this address set and
# has no on-demand path of its own. A sweep sends only to the addresses that
# spent since the last one — at a job a minute, usually one — so the cadence
# costs a transfer or two an hour rather than a refill of the whole pool.
#
# What this does not do is watch the funding wallet. The script returns as soon
# as it finds every address at the target, and both reads of the wallet — the
# affordability check and the runway figure — sit on the path that sends. So a
# quiet hour reports the pool, not what is left to refill it with, and an empty
# wallet surfaces on the first hour a top-up is actually due.
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      env:
        description: Networks to fund (comma-separated)
        required: false
        default: dev,testnet
        type: string
      topup:
        description: Fill every address to this many ETH (blank keeps the default target)
        required: false
        default: ''
        type: string
      # The caps exist to stop a mistyped figure, not a deliberate one. A
      # target that fills every address costs target x addresses, which passes
      # the per-run cap sized for the band as soon as it rises above it, so a
      # manual fill needs a way to raise the cap for that run alone.
      # Blank keeps the repository variable, or the schema default under it.
      max_per_run:
        description: Per-run spend cap in ETH for this run (blank keeps the default)
        required: false
        default: ''
        type: string
      max_per_address:
        description: Per-address cap in ETH for this run; topup must not exceed it (blank keeps the default)
        required: false
        default: ''
        type: string
      include_midnight:
        description: Include the dedicated Midnight stagenet worker in the same spend cap
        required: false
        default: false
        type: boolean
      dry_run:
        description: Report what would be sent, send nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Never overlapping: two runs would read the same balances and each send a full
# top-up from the same wallet, racing nonces and overfunding. Queued rather than
# cancelled, so a manual run cannot silently drop a scheduled one mid-transfer.
#
# Every network is funded by a single invocation rather than a job per network.
# The spend caps govern a run, and a process per network would enforce each cap
# against its own total — letting combined spend reach a multiple of the figure
# that was set.
concurrency:
  group: fund-bidirectional-workers
  cancel-in-progress: false

jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Pinger Test ENV
    env:
      SIG_ETH_RPC_URL_SEPOLIA: ${{ secrets.SIG_ETH_RPC_URL_SEPOLIA }}
      SIG_SOL_RPC_URL_DEV: ${{ secrets.SIG_SOL_RPC_URL_DEV }}
      SIG_BIDIRECTIONAL_FUNDING_SK: ${{ secrets.SIG_BIDIRECTIONAL_FUNDING_SK }}
      # The worker addresses follow from this key's *public* half, so the sweep
      # derives the requester rather than being told it. Passed here as the
      # same secret the service signs with, so the two cannot drift.
      SIG_SOL_SK: ${{ secrets.SIG_SOL_SK }}
      # Optional cross-check. Set it only when this runs against a service
      # holding a different key; a mismatch then fails the run rather than
      # funding addresses nothing spends from.
      SIG_BIDIRECTIONAL_REQUESTER_PUBKEY: ${{ vars.SIG_BIDIRECTIONAL_REQUESTER_PUBKEY }}
      SIG_BIDIRECTIONAL_PATHS: ${{ vars.SIG_BIDIRECTIONAL_PATHS }}
      SIG_BIDIRECTIONAL_PATH_PREFIX: ${{ vars.SIG_BIDIRECTIONAL_PATH_PREFIX }}
      # Must match the deployed service. Unset there and unset here both mean
      # "pair the root key to the program address"; set on one side only
      # derives a different address set entirely.
      MPC_MIDNIGHT_CALLER_ADDRESS: ${{ vars.MPC_MIDNIGHT_CALLER_ADDRESS }}
      MPC_MIDNIGHT_ROOT_PUBLIC_KEY: ${{ vars.MPC_MIDNIGHT_ROOT_PUBLIC_KEY }}
      SIG_SOL_ROOT_PUBLIC_KEY: ${{ vars.SIG_SOL_ROOT_PUBLIC_KEY }}
      # Thresholds are variables, not constants: the right band depends on the
      # measured gas of the enabled transaction mode and on how long a pool
      # must survive without a sweep. Every default below, and the arithmetic
      # that sizes it, lives in src/utils/env.ts — passed through unset here so
      # the number is written down once. Setting the variable overrides it.
      # The two caps also take a dispatch input, which wins for that run; a
      # schedule carries no inputs, so the sweep always runs under the default.
      # A malformed input fails schema validation before anything is sent.
      SIG_BIDIRECTIONAL_MIN_BALANCE_WEI: ${{ vars.SIG_BIDIRECTIONAL_MIN_BALANCE_WEI }}
      SIG_BIDIRECTIONAL_FUND_TOPUP_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_TOPUP_ETH }}
      SIG_BIDIRECTIONAL_FUND_MAX_PER_ADDRESS_ETH: ${{ inputs.max_per_address || vars.SIG_BIDIRECTIONAL_FUND_MAX_PER_ADDRESS_ETH }}
      SIG_BIDIRECTIONAL_FUND_MAX_PER_RUN_ETH: ${{ inputs.max_per_run || vars.SIG_BIDIRECTIONAL_FUND_MAX_PER_RUN_ETH }}
      SIG_BIDIRECTIONAL_FUND_RESERVE_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_RESERVE_ETH }}

      # Cross-check the derived addresses against the deployed service before
      # spending. Five values must agree across the two — the path count and
      # prefix, the root key, the requester key, and the balance minimum — and
      # drift is otherwise silent: ETH goes to addresses no job uses while the
      # real pool starves. Unreachable is not a failure; disagreeing is.
      # Both optional, and the cross-check runs only with both. Unset means the
      # sweep funds the addresses it derived without comparing them to what the
      # service reports — which is the intended fallback, since deriving
      # locally is what lets funding work while the service is down.
      SIG_BIDIRECTIONAL_SERVICE_URL: ${{ vars.SIG_BIDIRECTIONAL_SERVICE_URL }}
      API_SECRET: ${{ secrets.LT_PINGER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate configuration
        run: |
          set -euo pipefail
          for name in SIG_ETH_RPC_URL_SEPOLIA SIG_SOL_RPC_URL_DEV \
                      SIG_BIDIRECTIONAL_FUNDING_SK SIG_SOL_SK; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required configuration: ${name}"
              exit 1
            fi
          done

      # Inputs reach the shell as environment variables rather than through
      # ${{ }} interpolation into the command line, which pastes whatever was
      # typed in the dispatch form straight into a shell string.
      - name: Fund workers
        run: |
          set -euo pipefail
          args=(--env "${ENV}")
          if [ "${INCLUDE_MIDNIGHT}" = 'true' ]; then args+=(--include-midnight); fi
          # Blank on the schedule and by default: every address below the
          # default target is filled to it. Given a figure, that is the target
          # instead — the same switch the ad hoc load test uses to fund for a
          # specific run.
          if [ -n "${TOPUP}" ]; then args+=(--topup "${TOPUP}"); fi
          if [ "${DRY_RUN}" = 'true' ]; then args+=(--dry-run); fi
          pnpm fund "${args[@]}"
        env:
          INCLUDE_MIDNIGHT: ${{ github.event_name == 'schedule' && vars.LT_MIDNIGHT_ENABLED == 'true' || inputs.include_midnight }}
          ENV: ${{ inputs.env || 'dev,testnet' }}
          TOPUP: ${{ inputs.topup }}
          DRY_RUN: ${{ inputs.dry_run }}
