name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # `dist/` is no longer committed, so nothing checks that the artifact matches
  # its source. What still needs checking is that the source compiles at all.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      # `pnpm build` only compiles src/. Tests and scripts import from it and
      # can break against a change there without anything noticing, which is
      # how a deleted module stayed imported by the end-to-end test through a
      # whole refactor.
      - name: Typecheck tests and scripts
        run: pnpm typecheck

  prettier-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run Prettier check
        run: pnpm prettier --check .

  test:
    runs-on: ubuntu-latest
    environment: Pinger Test ENV
    env:
      PORT: 3001
      NODE_ENV: development
      API_SECRET: test-secret-key
      SIG_ETH_RPC_URL_SEPOLIA: ${{ secrets.SIG_ETH_RPC_URL_SEPOLIA }}
      SIG_ETH_RPC_URL_MAINNET: ${{ secrets.SIG_ETH_RPC_URL_MAINNET }}
      SIG_EVM_SK_1: ${{ secrets.SIG_EVM_SK_1 }}
      SIG_EVM_SK_2: ${{ secrets.SIG_EVM_SK_2 }}
      SIG_EVM_SK_3: ${{ secrets.SIG_EVM_SK_3 }}
      SIG_EVM_SK_4: ${{ secrets.SIG_EVM_SK_4 }}
      SIG_EVM_SK_5: ${{ secrets.SIG_EVM_SK_5 }}
      SIG_SOL_RPC_URL_DEV: ${{ secrets.SIG_SOL_RPC_URL_DEV }}
      SIG_SOL_RPC_URL_MAINNET: ${{ secrets.SIG_SOL_RPC_URL_MAINNET }}
      SIG_SOL_SK: ${{ secrets.SIG_SOL_SK }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test
