name: Solana Bidirectional (ad hoc)

# Runs a load test entirely inside the job: it starts a pinger, drives it, and
# throws it away. Nothing external is touched beyond the chains themselves, so
# this needs no access to the deployed service and cannot disturb it.
#
# The addresses under test are derived from this environment's SIG_SOL_SK and
# from the chosen network's program, so each network has its own pool and both
# have to be funded separately. `pnpm fund` derives the same sets from the same
# key.
#
# Funding runs first, in its own job. `pnpm fund` tops up only the addresses
# already below the minimum, so a healthy pool costs nothing and a depleted one
# is refilled before any job is submitted rather than starving partway through
# a run that has already spent an hour.
#
# Unscheduled on purpose: every job spends gas from addresses only a sweep
# refills, so a recurring run is a standing cost that should be chosen rather
# than inherited.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Round trips to drive
        required: false
        default: '50'
        type: string
      env:
        description: MPC network
        required: false
        default: testnet
        type: choice
        options:
          - dev
          - testnet
      mode:
        description: Transaction mode
        required: false
        default: eth_self_transfer
        type: choice
        options:
          - eth_self_transfer
          - erc20_zero_transfer
      paths:
        description: Derived addresses to spread jobs across
        required: false
        default: '10'
        type: string
      fund:
        description: Top up any address below the minimum before driving load
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# The derived addresses are shared state: two runs would lease the same ones
# and collide on their nonces.
concurrency:
  group: sol-bidirectional-adhoc
  cancel-in-progress: false

jobs:
  # Separate from the load test so the two hold different locks. This job takes
  # the scheduled sweep's concurrency group — both spend from the same wallet,
  # and two senders racing one nonce leaves a stuck transaction — while the load
  # test below runs outside it. Putting the group on the whole workflow instead
  # would block every scheduled sweep for the two hours a run can last.
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Pinger Test ENV
    concurrency:
      group: fund-bidirectional-workers
      cancel-in-progress: false
    outputs:
      result: ${{ steps.fund.outputs.result }}
    env:
      SIG_ETH_RPC_URL_SEPOLIA: ${{ secrets.SIG_ETH_RPC_URL_SEPOLIA }}
      SIG_SOL_RPC_URL_DEV: ${{ secrets.SIG_SOL_RPC_URL_DEV }}
      SIG_SOL_SK: ${{ secrets.SIG_SOL_SK }}
      SIG_BIDIRECTIONAL_FUNDING_SK: ${{ secrets.SIG_BIDIRECTIONAL_FUNDING_SK }}
      # The address set is a function of these four. They are repeated verbatim
      # on the load test job below, because funding a set the run does not use
      # is silent: the sweep reports success and every job still starves.
      SIG_BIDIRECTIONAL_PATHS: ${{ inputs.paths || '10' }}
      SIG_BIDIRECTIONAL_PATH_PREFIX: ${{ vars.SIG_BIDIRECTIONAL_PATH_PREFIX || 'load' }}
      SIG_SOL_ROOT_PUBLIC_KEY: ${{ vars.SIG_SOL_ROOT_PUBLIC_KEY }}
      # Kept level with the scheduled sweep so both hold the same band. A
      # difference here strands addresses between the two minimums: too poor to
      # lease, too rich to top up.
      SIG_BIDIRECTIONAL_FUND_MIN_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_MIN_ETH || '0.002' }}
      SIG_BIDIRECTIONAL_FUND_TOPUP_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_TOPUP_ETH || '0.0035' }}
      SIG_BIDIRECTIONAL_FUND_MAX_PER_ADDRESS_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_MAX_PER_ADDRESS_ETH || '0.02' }}
      SIG_BIDIRECTIONAL_FUND_MAX_PER_RUN_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_MAX_PER_RUN_ETH || '0.1' }}
      SIG_BIDIRECTIONAL_FUND_RESERVE_ETH: ${{ vars.SIG_BIDIRECTIONAL_FUND_RESERVE_ETH || '0.005' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Best-effort by design. The authoritative go/no-go is the balance check
      # on the load test job, which reads what the addresses actually hold; a
      # sweep that could not run is one reason they might be short, not a
      # separate verdict on the same question. So this reports why it failed
      # and lets that check decide.
      - name: Fund any address below the minimum
        id: fund
        run: |
          set -uo pipefail
          if [ "${{ inputs.fund }}" = "false" ]; then
            echo 'result=skipped (not requested)' >> "${GITHUB_OUTPUT}"
            echo 'Funding not requested; addresses are used as they stand.'
            exit 0
          fi
          if [ -z "${SIG_BIDIRECTIONAL_FUNDING_SK:-}" ]; then
            echo 'result=skipped (no funding key)' >> "${GITHUB_OUTPUT}"
            echo '::warning::SIG_BIDIRECTIONAL_FUNDING_SK is not set; skipping the top-up.'
            exit 0
          fi
          # Only addresses under SIG_BIDIRECTIONAL_FUND_MIN_ETH are topped up,
          # so this is already the conditional the run wants: a funded pool
          # prints "every address is above the minimum" and sends nothing.
          if pnpm fund --env "${ENV}" 2>&1 | tee fund.log; then
            echo 'result=ok' >> "${GITHUB_OUTPUT}"
          else
            echo 'result=failed' >> "${GITHUB_OUTPUT}"
            # The script's own reason, not pnpm's exit-code wrapper, which is
            # the last line and says nothing about why.
            reason=$(grep '✗' fund.log | tail -1 || true)
            echo "::warning::Top-up failed: ${reason:-see the step log}"
          fi
        env:
          ENV: ${{ inputs.env || 'testnet' }}

  loadtest:
    needs: fund
    runs-on: ubuntu-latest
    # Submission is bounded by the arrival-rate limit and the last job then
    # waits out Ethereum finality: roughly `jobs / rate` minutes plus forty.
    timeout-minutes: 120
    environment: Pinger Test ENV
    env:
      # This job's own server, so the secret is local to the job rather than
      # anything deployed.
      API_SECRET: adhoc-loadtest
      PORT: '3001'
      SIG_ETH_RPC_URL_SEPOLIA: ${{ secrets.SIG_ETH_RPC_URL_SEPOLIA }}
      SIG_SOL_RPC_URL_DEV: ${{ secrets.SIG_SOL_RPC_URL_DEV }}
      SIG_SOL_SK: ${{ secrets.SIG_SOL_SK }}
      # Verbatim from the fund job above: these four decide which addresses are
      # derived, and the two jobs have to land on the same set.
      SIG_BIDIRECTIONAL_PATHS: ${{ inputs.paths || '10' }}
      SIG_BIDIRECTIONAL_PATH_PREFIX: ${{ vars.SIG_BIDIRECTIONAL_PATH_PREFIX || 'load' }}
      SIG_SOL_ROOT_PUBLIC_KEY: ${{ vars.SIG_SOL_ROOT_PUBLIC_KEY }}
      SIG_BIDIRECTIONAL_MIN_BALANCE_WEI: ${{ vars.SIG_BIDIRECTIONAL_MIN_BALANCE_WEI || '2000000000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in SIG_ETH_RPC_URL_SEPOLIA SIG_SOL_RPC_URL_DEV SIG_SOL_SK; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - name: Build
        run: pnpm build

      - name: Start the pinger
        run: |
          set -euo pipefail
          # `node` directly, not `pnpm start`: pnpm forks the server as a
          # child, so `$!` would capture the wrapper and the stop step below
          # would leave the real process running.
          node dist/index.js > pinger.log 2>&1 &
          echo $! > pinger.pid
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/" > /dev/null; then
              echo "pinger up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pinger did not start"
          cat pinger.log
          exit 1

      # The authoritative check, and the only one that reads what the addresses
      # actually hold rather than what a sweep believed it sent. Runs after the
      # top-up so it reports the balances the run will really spend from, and
      # still fails the run when the pool is dry — a top-up that was skipped or
      # refused is not a reason to submit jobs that cannot broadcast.
      - name: Check worker funding
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "x-api-secret: ${API_SECRET}" \
            "http://localhost:${PORT}/sign_bidirectional/workers?env=${ENV}" \
            | tee workers.json \
            | jq -r '.workers[] | "  \(.path)  \(.address)  \(.balanceWei) wei\(if .underfunded then "  UNDERFUNDED" else "" end)"'

          short=$(jq '[.workers[] | select(.underfunded)] | length' workers.json)
          total=$(jq '.workers | length' workers.json)
          echo "${short}/${total} addresses below the minimum"
          if [ "${short}" -eq "${total}" ]; then
            echo "::error::Every address is underfunded after the top-up (${FUND_RESULT}). Check the funding wallet's balance, then re-run."
            exit 1
          fi
          if [ "${short}" -gt 0 ]; then
            echo "::warning::${short} address(es) underfunded; throughput is limited to the rest"
          fi
        env:
          ENV: ${{ inputs.env || 'testnet' }}
          FUND_RESULT: ${{ needs.fund.outputs.result }}

      # The driver exits non-zero if any job failed, so a single MPC timeout in
      # fifty reds the run. Deliberate for an on-request test that a person
      # reads: the summary below renders either way, and green means every
      # round trip completed rather than most of them.
      - name: Drive the load test
        run: |
          set -euo pipefail
          pnpm loadtest \
            --jobs "${{ inputs.jobs || '50' }}" \
            --env "${{ inputs.env || 'testnet' }}" \
            --mode "${{ inputs.mode || 'eth_self_transfer' }}" \
            --url "http://localhost:${PORT}" \
            | tee loadtest.log

      - name: Stop the pinger
        if: always()
        run: |
          [ -f pinger.pid ] && kill "$(cat pinger.pid)" 2>/dev/null || true
          echo "--- last 40 lines of the pinger log ---"
          tail -40 pinger.log || true

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Solana Bidirectional (ad hoc)"
            echo
            echo "- Network: \`${{ inputs.env || 'testnet' }}\`"
            echo "- Mode: \`${{ inputs.mode || 'eth_self_transfer' }}\`"
            echo "- Jobs: \`${{ inputs.jobs || '50' }}\` across \`${{ inputs.paths || '10' }}\` addresses"
            echo "- Top-up: \`${{ needs.fund.outputs.result }}\`"
            echo
            if [ -f loadtest.log ]; then
              echo '```'
              # The tail carries the counts, failure reasons and latency table.
              tail -32 loadtest.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
