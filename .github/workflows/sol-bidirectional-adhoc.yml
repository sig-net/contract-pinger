name: Solana Bidirectional (ad hoc)

# Drives a load test against the deployed pinger, on request.
#
# The service under test is the deployed one, not a copy started inside the
# job, so this needs almost no secrets: the deployed instance holds its own
# keys and RPC URLs, and the jobs run on its funded addresses. That is also
# what makes the result meaningful — it measures the thing that is actually
# serving, rather than a fresh process with a different key and an empty pool.
#
# Unscheduled on purpose. Every job spends gas from addresses only a sweep
# refills, so a recurring run is a standing cost that should be decided
# deliberately rather than inherited from a default.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Round trips to drive
        required: false
        default: '50'
        type: string
      env:
        description: MPC network
        required: false
        default: testnet
        type: choice
        options:
          - dev
          - testnet
      mode:
        description: Transaction mode
        required: false
        default: eth_self_transfer
        type: choice
        options:
          - eth_self_transfer
          - erc20_zero_transfer
      url:
        description: Pinger to drive
        required: false
        default: https://contract-ping.sig.network
        type: string

permissions:
  contents: read

# The deployed instance has one address pool and one arrival-rate limit, so
# two runs would contend for the same addresses and starve each other on 429s.
concurrency:
  group: sol-bidirectional-adhoc
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    # Submission is bounded by the service's arrival-rate limit, and the last
    # job then waits out Ethereum finality: roughly `jobs / rate` minutes plus
    # forty. Generous enough for a few hundred jobs at the default rate.
    timeout-minutes: 120
    environment: Pinger Test ENV
    env:
      # The deployed service's own secret — the same value k6 sends. Nothing
      # else here is needed: the pinger holds its keys and RPC URLs.
      API_SECRET: ${{ secrets.LT_PINGER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${API_SECRET:-}" ]; then
            echo "::error::Missing secret LT_PINGER_API_KEY — the deployed pinger rejects every request without it"
            exit 1
          fi

      # Reports each address and its balance before spending anything, so a
      # run that is about to fail on gas says so up front rather than after
      # submitting jobs that cannot broadcast.
      - name: Check worker funding
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            -H "x-api-secret: ${API_SECRET}" \
            "${URL}/sign_bidirectional/workers?env=${ENV}" \
            | tee workers.json | jq -r '.workers[] | "  \(.path)  \(.address)  \(.balanceWei) wei\(if .underfunded then "  UNDERFUNDED" else "" end)"'

          short=$(jq '[.workers[] | select(.underfunded)] | length' workers.json)
          total=$(jq '.workers | length' workers.json)
          echo "${short}/${total} addresses are below the minimum"
          if [ "${short}" -eq "${total}" ]; then
            echo "::error::Every address is underfunded; run the Fund Bidirectional Workers workflow first"
            exit 1
          fi
          if [ "${short}" -gt 0 ]; then
            echo "::warning::${short} address(es) underfunded — throughput will be limited to the rest"
          fi
        env:
          URL: ${{ inputs.url || 'https://contract-ping.sig.network' }}
          ENV: ${{ inputs.env || 'testnet' }}

      - name: Drive the load test
        run: |
          pnpm loadtest \
            --jobs "${{ inputs.jobs || '50' }}" \
            --env "${{ inputs.env || 'testnet' }}" \
            --mode "${{ inputs.mode || 'eth_self_transfer' }}" \
            --url "${{ inputs.url || 'https://contract-ping.sig.network' }}" \
          | tee loadtest.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Solana Bidirectional (ad hoc)"
            echo
            echo "- Target: \`${{ inputs.url || 'https://contract-ping.sig.network' }}\`"
            echo "- Network: \`${{ inputs.env || 'testnet' }}\`"
            echo "- Mode: \`${{ inputs.mode || 'eth_self_transfer' }}\`"
            echo "- Jobs: \`${{ inputs.jobs || '50' }}\`"
            echo
            if [ -f loadtest.log ]; then
              echo '```'
              # The tail carries the counts, failure reasons and latency table.
              tail -32 loadtest.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
